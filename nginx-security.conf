# ==============================================================================
# Siribrand Zanzibar Tours - Hardened Nginx Production Configuration
# Focus: Security Headers, Performance, Information Hiding & Scalability
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name siribrandagency.click www.siribrandagency.click;
    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name siribrandagency.click www.siribrandagency.click;

    root /var/www/siribrand/dist;
    index index.html;

    # 1. HIDE SERVER FINGERPRINTS & TOKENS (Information Disclosure Prevention)
    server_tokens off; # Hides nginx version number
    # If headers-more module is installed:
    # more_clear_headers 'Server';
    # more_clear_headers 'X-Powered-By';

    # 2. ENTERPRISE SECURITY HEADERS
    # Enforce strict HTTPS for 1 year + subdomains + preload
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Prevent clickjacking / iframe embedding
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Prevent MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Referrer privacy protection
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Restrict unneeded browser hardware access
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # Content Security Policy (XSS, Injection & Defacement Defense)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://images.unsplash.com https://*.unsplash.com blob:; media-src 'self' blob:; connect-src 'self' https://api.whatsapp.com https://wa.me; frame-ancestors 'self';" always;

    # 3. HIGH SCALABILITY & GZIP / BROTLI COMPRESSION
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # 4. IMMUTABLE CACHE FOR PRODUCTION ASSETS (Assets hash-versioned by Vite)
    location ~* \.(?:css|js|woff2?|svg|png|jpe?g|webp|ico|mp4)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 5. SPA ROUTING (Single Page Application fallback to index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
